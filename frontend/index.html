<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Gyan Sutra | Bhagavad Gita and Ramayana</title>
    <meta name="description" content="Read the Bhagavad Gita and Valmiki Ramayana in Sanskrit and English. Search verses, read commentary, and ask Sarathi for help." />
    <meta name="keywords" content="Bhagavad Gita, Valmiki Ramayana, Sanskrit, scripture, Gita, Hindu, verses, chapter, karma, dharma, atman, Sarathi" />
    <meta name="author" content="Gyan Sutra" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- PWA — %BASE_URL% is substituted by Vite at build time for each deployment -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#F6EFDD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1420" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gyan Sutra" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />

    <!-- Open Graph — og:image uses absolute HTTPS URL on Cloudflare -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:site_name" content="Gyan Sutra" />
    <meta property="og:title" content="Gyan Sutra | Bhagavad Gita and Ramayana" />
    <meta property="og:description" content="Read the Bhagavad Gita and Valmiki Ramayana in Sanskrit and English. Search verses, read commentary, and ask Sarathi for help." />
    <meta property="og:image" content="https://gyansutraapp.pages.dev/linkedin/gyan-sutra-linkedin-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="Gyan Sutra scripture library" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gyan Sutra | Bhagavad Gita and Ramayana" />
    <meta name="twitter:description" content="Read the Bhagavad Gita and Valmiki Ramayana in Sanskrit and English. Search verses, read commentary, and ask Sarathi for help." />
    <meta name="twitter:image" content="https://gyansutraapp.pages.dev/linkedin/gyan-sutra-linkedin-cover.png" />

    <!-- Prevent flash of wrong theme — apply before first paint -->
    <script>
      (function() {
        var stored = localStorage.getItem('gyansutra-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!--
      GitHub Pages SPA restore — pairs with public/404.html.
      Restores the target pathname before React Router boots.
    -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          try {
            var parsed = JSON.parse(redirect);
            if (parsed.pathname && parsed.pathname !== window.location.pathname) {
              window.history.replaceState(null, null, parsed.pathname + (parsed.search || '') + (parsed.hash || ''));
            }
          } catch (e) { /* ignore */ }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
