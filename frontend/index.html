<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Gyan Sutra | Bhagavad Gita and Ramayana</title>
    <meta name="description" content="Read the Bhagavad Gita and Valmiki Ramayana in Sanskrit and English. Search verses, read commentary, and ask Sarathi for help." />
    <meta name="keywords" content="Bhagavad Gita, Valmiki Ramayana, Sanskrit, scripture, Gita, Hindu, verses, chapter, karma, dharma, atman, Sarathi" />
    <meta name="author" content="Gyan Sutra" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- PWA - %BASE_URL% is substituted by Vite at build time for each deployment -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#F6EFDD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1420" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gyan Sutra" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />

    <!-- Open Graph - og:image uses absolute HTTPS URL on Cloudflare -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:site_name" content="Gyan Sutra" />
    <meta property="og:title" content="Gyan Sutra | Bhagavad Gita and Ramayana" />
    <meta property="og:description" content="Read the Bhagavad Gita and Valmiki Ramayana in Sanskrit and English. Search verses, read commentary, and ask Sarathi for help." />
    <meta property="og:image" content="https://gyansutraapp.pages.dev/linkedin/gyan-sutra-linkedin-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="Gyan Sutra scripture library" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gyan Sutra | Bhagavad Gita and Ramayana" />
    <meta name="twitter:description" content="Read the Bhagavad Gita and Valmiki Ramayana in Sanskrit and English. Search verses, read commentary, and ask Sarathi for help." />
    <meta name="twitter:image" content="https://gyansutraapp.pages.dev/linkedin/gyan-sutra-linkedin-cover.png" />

    <!-- Prevent flash of wrong theme - apply before first paint -->
    <script>
      (function() {
        var stored = localStorage.getItem('gyansutra-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Critical boot layer: visible before the JavaScript bundle is parsed. -->
    <style>
      #gs-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f6efdd;
        opacity: 1;
        transition: opacity 220ms ease, visibility 220ms ease;
      }
      [data-theme="dark"] #gs-boot-splash { background: #1c1420; }
      #gs-boot-splash.is-leaving { opacity: 0; visibility: hidden; }
      .gs-boot-splash__content {
        display: grid;
        justify-items: center;
        gap: 0.8rem;
        animation: gs-boot-arrive 420ms cubic-bezier(.2,.8,.2,1) both;
      }
      .gs-boot-splash__logo {
        width: 62px;
        height: 62px;
        filter: drop-shadow(0 5px 14px rgba(190, 106, 46, .18));
      }
      .gs-boot-splash__name {
        margin: 0;
        color: #241a2e;
        font: 600 1rem/1.2 Georgia, serif;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      [data-theme="dark"] .gs-boot-splash__name { color: #efe8f5; }
      .gs-boot-splash__thread {
        width: 42px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(201, 154, 78, .22);
      }
      .gs-boot-splash__thread::after {
        content: '';
        display: block;
        width: 55%;
        height: 100%;
        border-radius: inherit;
        background: #e8a33d;
        animation: gs-boot-thread 620ms ease-in-out infinite alternate;
      }
      @keyframes gs-boot-arrive {
        from { opacity: 0; transform: translateY(5px) scale(.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes gs-boot-thread {
        from { transform: translateX(-70%); }
        to { transform: translateX(150%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .gs-boot-splash__content,
        .gs-boot-splash__thread::after { animation: none; }
        #gs-boot-splash { transition-duration: 80ms; }
      }
    </style>

    <!--
      GitHub Pages SPA restore - pairs with public/404.html.
      Restores the target pathname before React Router boots.
    -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          try {
            var parsed = JSON.parse(redirect);
            if (parsed.pathname && parsed.pathname !== window.location.pathname) {
              window.history.replaceState(null, null, parsed.pathname + (parsed.search || '') + (parsed.hash || ''));
            }
          } catch (e) { /* ignore */ }
        }
      })();
    </script>
  </head>
  <body>
    <div id="gs-boot-splash" aria-hidden="true">
      <div class="gs-boot-splash__content">
        <img class="gs-boot-splash__logo" src="%BASE_URL%icons/logo.svg" alt="" width="62" height="62" />
        <p class="gs-boot-splash__name">Gyan Sutra</p>
        <span class="gs-boot-splash__thread"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
