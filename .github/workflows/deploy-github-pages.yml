name: Deploy to GitHub Pages

# Triggers on every push to main branch.
# Also allows manual runs from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-progress deployment if a new push arrives.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ───────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── 4. Build with GitHub Pages settings ───────────────────────────────
      #   VITE_BASE_PATH  → Vite sets base='/GyanSutra/' in the build output,
      #                     so all asset URLs are prefixed correctly.
      #   VITE_SITE_URL   → Used for documentation / future server-side meta.
      #   VITE_API_BASE_URL → Your Render backend URL.
      #                       Set this in: GitHub → Settings → Secrets and
      #                       variables → Actions → New repository secret.
      #                       Name: VITE_API_BASE_URL
      #                       Value: https://<your-service>.onrender.com
      - name: Build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /GyanSutra/
          VITE_SITE_URL: https://santanu-sp.github.io/GyanSutra
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      # ── 5. SPA fallback — copy index.html → 404.html ──────────────────────
      #   public/404.html (the purpose-built redirect shim) is already copied
      #   into dist/ by Vite. This step is a belt-and-suspenders safety copy
      #   in case the shim is not present for any reason.
      - name: Ensure SPA 404 fallback exists
        run: |
          if [ ! -f frontend/dist/404.html ]; then
            cp frontend/dist/index.html frontend/dist/404.html
            echo "Copied index.html → 404.html (fallback)"
          else
            echo "404.html already present (from public/404.html)"
          fi

      # ── 6. Disable Jekyll processing ──────────────────────────────────────
      #   GitHub Pages runs Jekyll by default, which ignores files/dirs that
      #   start with '_'. Vite outputs chunks like _assets/. .nojekyll stops
      #   Jekyll so those files are served correctly.
      - name: Create .nojekyll
        run: touch frontend/dist/.nojekyll

      # ── 7. Upload Pages artifact ───────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
